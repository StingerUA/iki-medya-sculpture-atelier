name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install 3D conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes assimp-utils

      - name: Prepare licensed AR models
        run: bash scripts/prepare-pages-models.sh

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Add SPA fallback
        run: |
          cp dist-pages/pages/index.html dist-pages/404.html
          cp dist-pages/pages/index.html dist-pages/index.html
          touch dist-pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
